[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evaloral"
dynamic = ["version"]
description = "Reproducibility package for EvalOral: evolving neuro-fuzzy oral-image pattern discovery and rule-aware visual auditing"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Paulo Vitor Campos de Souza"},
  {name = "Maria Isabel Villalobos"},
  {name = "Alisson Marques da Silva"}
]
license = {text = "MIT"}
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.0,<4",
  "scikit-learn>=1.4,<2",
  "scipy>=1.11,<2",
  "matplotlib>=3.8,<4",
  "Pillow>=10,<13"
]

[project.optional-dependencies]
xai = ["torch>=2.2,<3"]
dev = ["pytest>=8,<10"]
all = ["torch>=2.2,<3", "pytest>=8,<10"]

[tool.setuptools.dynamic]
version = {attr = "evaloral.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
